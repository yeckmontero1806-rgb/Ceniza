<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Ceniza — Reservaciones</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --black-0:#070605;
    --black-1:#100d0b;
    --black-2:#1a1512;
    --ash:#332922;
    --ember:#b5622f;
    --ember-dim:#8a4c28;
    --cream:#eae1d4;
    --cream-dim:#b9ada0;
    --line: rgba(234,225,212,0.1);
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}

  body{
    background: linear-gradient(180deg, var(--black-0) 0%, var(--black-1) 40%, var(--black-0) 100%);
    color:var(--cream);
    font-family:'Jost', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-weight:300;
    overflow-x:hidden;
    min-height:100vh;
  }

  .container{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:20px;
  }

  .auth-box{
    background: linear-gradient(135deg, rgba(51,41,34,0.8), rgba(26,21,18,0.9));
    border:1px solid var(--line);
    border-radius:4px;
    padding:60px 40px;
    max-width:420px;
    width:100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  .auth-box h1{
    font-family:'Fraunces', serif;
    font-size:32px;
    margin-bottom:10px;
    color:var(--cream);
  }

  .auth-box .subtitle{
    font-size:13px;
    color:var(--cream-dim);
    margin-bottom:40px;
    letter-spacing:0.08em;
  }

  .tab-buttons{
    display:flex;
    gap:10px;
    margin-bottom:30px;
    border-bottom:1px solid var(--line);
    padding-bottom:15px;
  }

  .tab-btn{
    flex:1;
    padding:10px;
    background:none;
    border:none;
    color:var(--cream-dim);
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.14em;
    cursor:pointer;
    transition:all .3s ease;
    border-bottom:2px solid transparent;
  }

  .tab-btn.active{
    color:var(--ember);
    border-bottom-color:var(--ember);
  }

  .auth-form{
    display:none;
  }

  .auth-form.active{
    display:block;
  }

  .field{
    margin-bottom:20px;
  }

  .field label{
    display:block;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.16em;
    color:var(--ember);
    margin-bottom:8px;
    font-weight:500;
  }

  .field input{
    width:100%;
    background:rgba(7,6,5,0.5);
    border:1px solid rgba(181,98,47,0.3);
    border-radius:2px;
    padding:12px 14px;
    font-family:inherit;
    font-size:14px;
    color:var(--cream);
    transition:all .3s ease;
  }

  .field input:focus{
    outline:none;
    border-color:var(--ember);
    background:rgba(7,6,5,0.7);
    box-shadow:0 0 0 2px rgba(181,98,47,0.2);
  }

  .field input::placeholder{
    color:rgba(234,225,212,0.4);
  }

  .btn{
    width:100%;
    padding:12px;
    background:linear-gradient(180deg, var(--ember) 0%, var(--ember-dim) 100%);
    border:1px solid var(--ember);
    color:#120c08;
    font-weight:500;
    border-radius:2px;
    cursor:pointer;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.14em;
    transition:all .3s ease;
  }

  .btn:hover{
    background:linear-gradient(180deg, #c47542 0%, var(--ember) 100%);
    box-shadow:0 8px 30px -6px rgba(181,98,47,0.5);
  }

  .btn:disabled{
    opacity:0.6;
    cursor:not-allowed;
  }

  .message{
    padding:12px;
    border-radius:2px;
    margin-bottom:20px;
    font-size:12px;
    display:none;
  }

  .message.show{
    display:block;
  }

  .message.error{
    background:rgba(255,107,107,0.2);
    border:1px solid #ff6b6b;
    color:#ff9999;
  }

  .message.success{
    background:rgba(107,255,107,0.2);
    border:1px solid #6bff6b;
    color:#99ff99;
  }

  .message.info{
    background:rgba(181,98,47,0.2);
    border:1px solid var(--ember);
    color:var(--ember);
  }

  /* ADMIN PANEL */
  .admin-container{
    display:none;
    max-width:1400px;
    margin:0 auto;
    padding:40px 20px;
  }

  .admin-container.active{
    display:block;
  }

  .admin-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:40px;
    padding-bottom:20px;
    border-bottom:1px solid var(--line);
  }

  .admin-header h1{
    font-family:'Fraunces', serif;
    font-size:32px;
    color:var(--cream);
  }

  .user-info{
    display:flex;
    align-items:center;
    gap:15px;
  }

  .user-email{
    font-size:12px;
    color:var(--cream-dim);
  }

  .logout-btn{
    padding:10px 20px;
    background:rgba(181,98,47,0.2);
    border:1px solid var(--ember-dim);
    color:var(--cream);
    border-radius:2px;
    cursor:pointer;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.12em;
    transition:all .3s ease;
  }

  .logout-btn:hover{
    background:rgba(181,98,47,0.4);
  }

  .stats{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));
    gap:20px;
    margin-bottom:40px;
  }

  .stat-card{
    background:rgba(51,41,34,0.5);
    border:1px solid var(--line);
    border-radius:2px;
    padding:24px;
    text-align:center;
  }

  .stat-value{
    font-size:32px;
    color:var(--ember);
    font-weight:600;
    margin-bottom:8px;
  }

  .stat-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.14em;
    color:var(--cream-dim);
  }

  .filters{
    margin-bottom:30px;
    display:flex;
    gap:15px;
    flex-wrap:wrap;
  }

  .filter-field{
    flex:1;
    min-width:200px;
  }

  .filter-field label{
    display:block;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.14em;
    color:var(--ember);
    margin-bottom:6px;
  }

  .filter-field input{
    width:100%;
    background:rgba(7,6,5,0.5);
    border:1px solid rgba(181,98,47,0.3);
    border-radius:2px;
    padding:10px;
    font-family:inherit;
    font-size:13px;
    color:var(--cream);
  }

  .table-wrapper{
    overflow-x:auto;
    background:rgba(51,41,34,0.5);
    border:1px solid var(--line);
    border-radius:2px;
  }

  table{
    width:100%;
    border-collapse:collapse;
    font-size:12px;
  }

  table th{
    background:rgba(26,21,18,0.8);
    padding:14px;
    text-align:left;
    font-weight:500;
    text-transform:uppercase;
    letter-spacing:0.12em;
    color:var(--ember);
    border-bottom:1px solid var(--line);
  }

  table td{
    padding:12px 14px;
    border-bottom:1px solid var(--line);
    color:var(--cream);
  }

  table tr:hover{
    background:rgba(181,98,47,0.08);
  }

  .empty-state{
    text-align:center;
    padding:60px 20px;
    opacity:0.6;
  }

  .loading{
    text-align:center;
    padding:40px;
    opacity:0.6;
  }

  @media (max-width: 768px) {
    .auth-box{
      padding:40px 25px;
    }

    .admin-header{
      flex-direction:column;
      gap:20px;
      align-items:flex-start;
    }

    .filters{
      flex-direction:column;
    }

    .filter-field{
      min-width:100%;
    }

    table{
      font-size:11px;
    }

    table th, table td{
      padding:8px;
    }

    .stats{
      grid-template-columns:1fr;
    }
  }
</style>
</head>
<body>

<!-- AUTH SECTION -->
<div class="container" id="authSection">
  <div class="auth-box">
    <h1>Ceniza Admin</h1>
    <p class="subtitle">Gestiona tus reservaciones</p>

    <div class="tab-buttons">
      <button class="tab-btn active" onclick="switchTab('login')">Ingresar</button>
      <button class="tab-btn" onclick="switchTab('signup')">Crear Cuenta</button>
    </div>

    <!-- LOGIN FORM -->
    <form class="auth-form active" id="loginForm" onsubmit="handleLogin(event)">
      <div class="message" id="loginError"></div>
      
      <div class="field">
        <label for="loginEmail">Correo Electrónico</label>
        <input type="email" id="loginEmail" placeholder="admin@ceniza.com" required>
      </div>
      
      <div class="field">
        <label for="loginPassword">Contraseña</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required>
      </div>
      
      <button type="submit" class="btn" id="loginBtn">Ingresar</button>
    </form>

    <!-- SIGNUP FORM -->
    <form class="auth-form" id="signupForm" onsubmit="handleSignup(event)">
      <div class="message" id="signupMessage"></div>
      
      <div class="field">
        <label for="signupEmail">Correo Electrónico</label>
        <input type="email" id="signupEmail" placeholder="tu@email.com" required>
      </div>
      
      <div class="field">
        <label for="signupPassword">Contraseña</label>
        <input type="password" id="signupPassword" placeholder="••••••••" minlength="6" required>
      </div>
      
      <div class="field">
        <label for="signupPassword2">Confirmar Contraseña</label>
        <input type="password" id="signupPassword2" placeholder="••••••••" required>
      </div>
      
      <button type="submit" class="btn" id="signupBtn">Crear Cuenta</button>
      
      <p style="text-align:center; margin-top:20px; font-size:11px; opacity:0.6;">
        Se enviará un correo de confirmación
      </p>
    </form>
  </div>
</div>

<!-- ADMIN PANEL -->
<div class="admin-container" id="adminSection">
  <div class="admin-header">
    <h1>Reservaciones</h1>
    <div class="user-info">
      <div>
        <div class="user-email" id="userEmail"></div>
      </div>
      <button class="logout-btn" onclick="handleLogout()">Cerrar Sesión</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-value" id="totalReservaciones">0</div>
      <div class="stat-label">Total de Reservaciones</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="proximasReservaciones">0</div>
      <div class="stat-label">Próximas Reservaciones</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="estaSemana">0</div>
      <div class="stat-label">Esta Semana</div>
    </div>
  </div>

  <div class="filters">
    <div class="filter-field">
      <label for="filterNombre">Buscar por Nombre</label>
      <input type="text" id="filterNombre" placeholder="Ej: Juan" onkeyup="filterTable()">
    </div>
    <div class="filter-field">
      <label for="filterFecha">Filtrar por Fecha</label>
      <input type="date" id="filterFecha" onchange="filterTable()">
    </div>
  </div>

  <div class="table-wrapper">
    <table id="reservacionesTable">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Teléfono</th>
          <th>Fecha Reserva</th>
          <th>Hora</th>
          <th>Personas</th>
          <th>Servicio</th>
          <th>Notas</th>
          <th>Registrado</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr>
          <td colspan="8" class="loading">Cargando reservaciones...</td>
        </tr>
      </tbody>
    </table>
    <div class="empty-state" id="emptyState" style="display:none;">
      <p>No hay reservaciones que mostrar</p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://imibozoirpsnpllylmjh.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImltaWJvem9pcnBzbnBsbHlsbWpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3NTU2NjYsImV4cCI6MjEwMjMzMTY2Nn0.RHekt23ywPqdmTzyx895Lbq3utGRxlQQ71UVBshk2Wg';
  
  let supabaseClient = null;
  let currentUser = null;
  let todasLasReservaciones = [];

  setTimeout(() => {
    if (window.supabase) {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      checkAuth();
      setupAuthListener();
    }
  }, 100);

  function setupAuthListener() {
    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (session) {
        currentUser = session.user;
        showAdminPanel();
        loadReservaciones();
      } else {
        showAuthForm();
      }
    });
  }

  function checkAuth() {
    supabaseClient.auth.getSession().then(({ data: { session } }) => {
      if (session) {
        currentUser = session.user;
        showAdminPanel();
        loadReservaciones();
      } else {
        showAuthForm();
      }
    });
  }

  function switchTab(tab) {
    document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    
    if (tab === 'login') {
      document.getElementById('loginForm').classList.add('active');
      document.querySelector('[onclick="switchTab(\'login\')"]').classList.add('active');
    } else {
      document.getElementById('signupForm').classList.add('active');
      document.querySelector('[onclick="switchTab(\'signup\')"]').classList.add('active');
    }
  }

  async function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    const loginBtn = document.getElementById('loginBtn');
    const loginError = document.getElementById('loginError');

    loginBtn.disabled = true;
    loginBtn.textContent = 'Ingresando...';

    try {
      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      if (error) throw error;

      currentUser = data.user;
      showAdminPanel();
      loadReservaciones();
    } catch (error) {
      showMessage('loginError', '❌ ' + (error.message || 'Error al ingresar'), 'error');
      loginBtn.disabled = false;
      loginBtn.textContent = 'Ingresar';
    }
  }

  async function handleSignup(e) {
    e.preventDefault();
    const email = document.getElementById('signupEmail').value;
    const password = document.getElementById('signupPassword').value;
    const password2 = document.getElementById('signupPassword2').value;
    const signupBtn = document.getElementById('signupBtn');
    const signupMsg = document.getElementById('signupMessage');

    if (password !== password2) {
      showMessage('signupMessage', '❌ Las contraseñas no coinciden', 'error');
      return;
    }

    signupBtn.disabled = true;
    signupBtn.textContent = 'Creando cuenta...';

    try {
      const { data, error } = await supabaseClient.auth.signUp({
        email,
        password,
        options: {
          emailRedirectTo: window.location.origin + '/admin'
        }
      });

      if (error) throw error;

      showMessage('signupMessage', '✓ Cuenta creada. Verifica tu email para confirmar.', 'info');
      
      setTimeout(() => {
        document.getElementById('signupForm').reset();
        signupBtn.disabled = false;
        signupBtn.textContent = 'Crear Cuenta';
      }, 2000);
    } catch (error) {
      showMessage('signupMessage', '❌ ' + (error.message || 'Error al crear cuenta'), 'error');
      signupBtn.disabled = false;
      signupBtn.textContent = 'Crear Cuenta';
    }
  }

  async function handleLogout() {
    await supabaseClient.auth.signOut();
    currentUser = null;
    todasLasReservaciones = [];
    showAuthForm();
  }

  function showAuthForm() {
    document.getElementById('authSection').style.display = 'flex';
    document.getElementById('adminSection').classList.remove('active');
  }

  function showAdminPanel() {
    document.getElementById('authSection').style.display = 'none';
    document.getElementById('adminSection').classList.add('active');
    document.getElementById('userEmail').textContent = currentUser?.email || '';
  }

  async function loadReservaciones() {
    try {
      const { data, error } = await supabaseClient
        .from('mis_citas')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) throw error;

      todasLasReservaciones = data || [];
      displayReservaciones(todasLasReservaciones);
      updateStats();
    } catch (error) {
      console.error('Error:', error);
      document.getElementById('tableBody').innerHTML = `<tr><td colspan="8" style="text-align:center; color:#ff9999;">Error cargando datos</td></tr>`;
    }
  }

  function displayReservaciones(reservaciones) {
    const tbody = document.getElementById('tableBody');
    const emptyState = document.getElementById('emptyState');

    if (!reservaciones || reservaciones.length === 0) {
      tbody.innerHTML = '';
      emptyState.style.display = 'block';
      return;
    }

    emptyState.style.display = 'none';
    tbody.innerHTML = reservaciones.map(r => `
      <tr>
        <td>${r.nombre_cliente || '-'}</td>
        <td>${r.teléfono || '-'}</td>
        <td>${r.fecha_reserva ? new Date(r.fecha_reserva).toLocaleDateString('es-ES') : '-'}</td>
        <td>${r.hora || '-'}</td>
        <td>${r.personas || '-'}</td>
        <td>${r.servicio_solicitado || '-'}</td>
        <td style="max-width:150px; overflow:hidden; text-overflow:ellipsis;">${r.notas || '-'}</td>
        <td>${new Date(r.created_at).toLocaleDateString('es-ES')}</td>
      </tr>
    `).join('');
  }

  function filterTable() {
    const nombre = document.getElementById('filterNombre').value.toLowerCase();
    const fecha = document.getElementById('filterFecha').value;

    let filtered = todasLasReservaciones.filter(r => {
      const matchNombre = !nombre || (r.nombre_cliente || '').toLowerCase().includes(nombre);
      const matchFecha = !fecha || r.fecha_reserva === fecha;
      return matchNombre && matchFecha;
    });

    displayReservaciones(filtered);
  }

  function updateStats() {
    const hoy = new Date();
    hoy.setHours(0, 0, 0, 0);

    const proximasReservaciones = todasLasReservaciones.filter(r => {
      const fecha = new Date(r.fecha_reserva);
      fecha.setHours(0, 0, 0, 0);
      return fecha >= hoy;
    }).length;

    const inicioSemana = new Date(hoy);
    inicioSemana.setDate(hoy.getDate() - hoy.getDay());
    const finSemana = new Date(inicioSemana);
    finSemana.setDate(inicioSemana.getDate() + 6);

    const estaSemana = todasLasReservaciones.filter(r => {
      const fecha = new Date(r.fecha_reserva);
      return fecha >= inicioSemana && fecha <= finSemana;
    }).length;

    document.getElementById('totalReservaciones').textContent = todasLasReservaciones.length;
    document.getElementById('proximasReservaciones').textContent = proximasReservaciones;
    document.getElementById('estaSemana').textContent = estaSemana;
  }

  function showMessage(elementId, message, type) {
    const el = document.getElementById(elementId);
    el.textContent = message;
    el.className = 'message show ' + type;
    
    if (type !== 'error') {
      setTimeout(() => {
        el.classList.remove('show');
      }, 4000);
    }
  }
</script>

</body>
</html>
